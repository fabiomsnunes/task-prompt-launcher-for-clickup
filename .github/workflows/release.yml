name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar versao do manifest com a tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            manifest.version = process.argv[1];
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          " "$VERSION"

      - run: node scripts/validate.mjs

      - name: Empacotar
        run: |
          zip -r "clickup-claude-launcher-${GITHUB_REF_NAME}.zip" \
            manifest.json content.js styles.css options.html options.css options.js icons background.js README.md

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "clickup-claude-launcher-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
